# =========================================================
#  SuperShop - Configuración general
#  Todo lo que ves acá se puede editar sin recompilar.
#  Usa /shop reload después de editar.
# =========================================================

gui:
  main-menu:
    title: "&8&l✦ &6&lShop &8&l✦"
    # Marco del menú principal (alterna entre los dos vidrios) y relleno interior
    border-glass: BLACK_STAINED_GLASS_PANE
    border-glass-alt: GRAY_STAINED_GLASS_PANE
    inner-glass: GRAY_STAINED_GLASS_PANE
    info-slot: 4
    info-name: "&6&l✦ TIENDA DEL SERVIDOR ✦"
    balance-head-slot: 49
    close-slot: 53

  category-menu:
    filler-glass: BLACK_STAINED_GLASS_PANE
    back-to-main-item: NETHER_STAR
    previous-page-item: FEATHER
    next-page-item: FIREWORK_ROCKET
    close-item: BARRIER
    sell-all-item: HOPPER
    page-info-item: PAPER
    balance-head-slot: 49
    back-to-main-slot: 46
    filter-slot: 47
    previous-page-slot: 48
    sell-all-slot: 50
    next-page-slot: 51
    page-info-slot: 52
    close-slot: 53
    # Salto de páginas: Shift+clic = primera/última, clic derecho = 5 páginas
    page-jump: 5

# Menú donde eliges cuánto comprar/vender (+1 +10 +64, resumen y confirmar)
purchase-menu:
  # Cantidad máxima por compra/venta (2304 = 36 stacks de 64)
  max-amount: 2304
  # true = el menú se cierra solo después de comprar/vender
  close-after-confirm: false

# Animaciones de los menús (todo activado por defecto)
animations:
  enabled: true
  # Cada cuántos ticks se mueve el marco (20 ticks = 1 segundo). 3 = fluido, 6 = suave.
  period-ticks: 3
  # Los ítems de cada página aparecen fila por fila al abrir el menú
  reveal-items: true
  # Ticks entre cada fila al revelar (1 = muy rápido)
  reveal-delay-ticks: 1
  # Colores del marco animado del menú principal (se recorren en orden)
  main-palette:
    - ORANGE_STAINED_GLASS_PANE
    - YELLOW_STAINED_GLASS_PANE
    - LIME_STAINED_GLASS_PANE
    - LIGHT_BLUE_STAINED_GLASS_PANE
    - PURPLE_STAINED_GLASS_PANE
    - MAGENTA_STAINED_GLASS_PANE
  # Brillo que recorre el marco de los menús de categoría y de compra
  comet-glass: WHITE_STAINED_GLASS_PANE
  # Cuántos paneles brillan a la vez
  comet-length: 3

sounds:
  click: UI_BUTTON_CLICK
  buy: ENTITY_EXPERIENCE_ORB_PICKUP
  sell: ENTITY_EXPERIENCE_ORB_PICKUP
  error: ENTITY_VILLAGER_NO
  page-turn: ITEM_BOOK_PAGE_TURN
  open: BLOCK_CHEST_OPEN
  amount: BLOCK_NOTE_BLOCK_HAT

particles:
  enabled: true
  buy: HAPPY_VILLAGER
  sell: HAPPY_VILLAGER

messages:
  prefix: "&8[&6Shop&8] &r"
  bought: "&a¡Compraste &f{amount}x {item} &apor &f${price}&a!"
  sold: "&a¡Vendiste &f{amount}x {item} &apor &f${price}&a!"
  sold-all: "&a¡Vendiste &f{amount} ítems &apor &f${price}&a!"
  nothing-to-sell: "&cNo tienes nada de esta categoría para vender."
  not-enough-money: "&cNo tienes suficiente dinero. Te faltan &f${missing}&c."
  not-enough-items: "&cNo tienes suficientes &f{item} &cpara vender."
  no-space: "&cNo tienes espacio suficiente en el inventario."
  no-sell: "&cEste ítem no se puede vender."
  no-buy: "&cEste ítem no se puede comprar."
  reload-success: "&a¡Shop recargado correctamente!"
  no-permission: "&cNo tienes permiso para hacer esto."
  only-players: "&cSolo un jugador puede usar este comando."
  category-disabled: "&cEsa categoría está deshabilitada por el momento."

# Cabeza que muestra el saldo del jugador
balance-head:
  name: "&6&lTu Saldo"
  lore:
    - "&8━━━━━━━━━━━━━━━━━━"
    - "&7Balance actual:"
    - "&a${balance}"
    - ""
    - "&7Compra y vende ítems en"
    - "&7las categorías de la tienda."

# =========================================================
#  FILTROS DENTRO DE CADA CATEGORÍA
#  Las categorías con muchos ítems (Bloques, Decoración...) muestran un botón de
#  filtro (embudo) para ver solo un tipo de ítem.
#
#  - La clave de cada bloque es la PRIMERA PALABRA del nombre de la categoría,
#    sin colores, tildes ni mayúsculas (Bloques -> bloques, Decoración -> decoracion).
#  - match:   lista de expresiones regulares (Java) sobre el nombre del Material.
#             Si el ítem cumple CUALQUIERA, aparece en el filtro.
#  - exclude: expresiones que lo sacan del filtro aunque cumpla "match".
#  - Sin "match" = muestra todo. Máximo 14 filtros por categoría.
#  - Un ítem puede aparecer en varios filtros (p. ej. las escaleras de roble salen en
#    "Escaleras y losas" y también en "Todo en madera").
#  - Un filtro sin ítems en la categoría no se muestra.
# =========================================================
category-filters:
  bloques:
    todos:
      name: "&f&lTodos los bloques"
      icon: NETHER_STAR
    tierra:
      name: "&2&lTierra y terreno"
      icon: GRASS_BLOCK
      match:
        - '^(DIRT|GRASS_BLOCK|COARSE_DIRT|PODZOL|MYCELIUM|ROOTED_DIRT|DIRT_PATH|FARMLAND|MUD|PACKED_MUD|CLAY|MOSS_BLOCK)$'
        - '^(SAND|RED_SAND|GRAVEL|SUSPICIOUS_SAND|SUSPICIOUS_GRAVEL|SNOW_BLOCK|ICE|PACKED_ICE|BLUE_ICE)$'
        - '^(PUMPKIN|MELON|HAY_BLOCK|DRIED_KELP_BLOCK|BONE_BLOCK|HONEYCOMB_BLOCK|SPONGE|WET_SPONGE)$'
        - 'MUSHROOM_(BLOCK|STEM)$'
    piedra:
      name: "&7&lPiedra"
      icon: STONE
      match:
        - '^(STONE|SMOOTH_STONE|COBBLESTONE|MOSSY_COBBLESTONE|GRANITE|POLISHED_GRANITE|DIORITE|POLISHED_DIORITE|ANDESITE|POLISHED_ANDESITE)$'
        - '^(CALCITE|TUFF|DRIPSTONE_BLOCK|OBSIDIAN|CRYING_OBSIDIAN|BASALT|SMOOTH_BASALT|POLISHED_BASALT)$'
        - 'DEEPSLATE'
        - 'BLACKSTONE'
      exclude:
        - '_(STAIRS|SLAB|WALL)$'
        - 'BRICKS$|TILES$'
    ladrillos:
      name: "&c&lLadrillos"
      icon: BRICKS
      match:
        - 'BRICKS?(_|$)'
        - 'TILES?(_|$)'
        - '^CHISELED_'
        - '^CRACKED_'
      exclude:
        - '^(STONE|SMOOTH_STONE)_SLAB$'
    arenisca:
