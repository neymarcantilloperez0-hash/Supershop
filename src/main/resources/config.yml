# =========================================================
#  ICONOS DE LAS CATEGORÍAS (cabezas) Y ESTADO DE CADA CATEGORÍA
#  La clave es la PRIMERA PALABRA del nombre de la categoría (igual que los filtros):
#    Bloques -> bloques | Madera -> madera | Decoración -> decoracion | Minerales -> minerales
#    Comida -> comida | Equipamiento -> equipamiento | Redstone y Utilidad -> redstone
#    Drops de Mobs -> drops | Spawners -> spawners | Objetos Especiales -> objetos
#
#  category-icons.<clave>:
#    texture:  cabeza personalizada. Acepta el HASH de textures.minecraft.net, la URL completa
#              o el código "Value" en base64 de minecraft-heads.com. Vacío = no usa cabeza.
#    material: ítem de respaldo (o ítem normal si no hay textura). Ej: ZOMBIE_HEAD, DIAMOND_SWORD.
#  Para cambiar una cabeza: busca otra en minecraft-heads.com y pega su "Value" en texture.
# =========================================================
category-icons:
  bloques:
    texture: "d3b5001a67007a93ade6659175e9054a92976b087fc629f042bcd57e7757646a"   # bloque de cuarzo
    material: QUARTZ_BLOCK
  madera:
    texture: "f19e856eab4efe937892701d6964de6abbea4e5d5f2072c3fd6b389cf883b5b9"   # tronco de roble
    material: OAK_LOG
  decoracion:
    texture: "347f3c29a57b8b6a958f5a83d029514cab9ff04826cf427b6d590af0d71283be"   # flor rosa
    material: PINK_TULIP
  minerales:
    texture: "1f74a9644ec3ccbe936ca6294297c0eece4716d25127bb1b12521f3f58df96da"   # bloque de diamante
    material: DIAMOND
  comida:
    texture: "e1cfc7c53b7b70b526fb15fdb2bb3579cd97a8954e712820bab6bd3bcbba9c4"   # filete
    material: COOKED_BEEF
  equipamiento:
    texture: ""
    material: DIAMOND_SWORD
  redstone:
    texture: ""
    material: REDSTONE
  drops:
    texture: ""
    material: ZOMBIE_HEAD
  spawners:
    texture: "647e2e5d55b6d04943519bed2557c6329e33b60b909dee8923cd88b115210"    # spawner
    material: SPAWNER
  objetos:
    texture: "98c8f82ccf8d2acb79008e17834002e8dc56e732ea89cc1db3bde4206658ef7d"   # caja de regalo
    material: FIREWORK_ROCKET

# Activar / desactivar categorías completas (se aplica con /shop reload).
# enabled: false -> la categoría sigue en el menú pero bloqueada: nadie puede abrirla ni comprar.
#   Los spawners vienen creados en shop.yml pero DESHABILITADOS. Para activarlos: enabled: true
# hidden: true  -> además la oculta del menú principal.
category-settings:
  bloques:      { enabled: true }
  madera:       { enabled: true }
  decoracion:   { enabled: true }
  minerales:    { enabled: true }
  comida:       { enabled: true }
  equipamiento: { enabled: true }
  redstone:     { enabled: true }
  drops:        { enabled: true }
  spawners:
    enabled: false
    hidden: false
  objetos:      { enabled: true }

# Cómo se ve una categoría deshabilitada en el menú principal
disabled-category:
  icon: BARRIER
  name: "{name} &8(&c&lDeshabilitada&8)"
  lore:
    - "&8━━━━━━━━━━━━━━━━━━"
    - "&cEsta categoría está desactivada"
    - "&7por el equipo administrativo."
    - ""
    - "&7Se activará más adelante."
