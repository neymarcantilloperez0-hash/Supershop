# =========================================================
#  SuperShop - Catálogo (10 categorías en rejilla 3-4-3, todo 1.20)
#  buy: precio de compra | sell: precio de venta (-1 = no se puede)
#  Menú principal: fila 1 = 11,13,15 | fila 2 = 19,21,23,25 | fila 3 = 29,31,33.
#
#  REGLAS DE ESTE ARCHIVO
#   - Cada ítem vive en UNA sola categoría (sin duplicados, sin arbitraje de precios).
#   - "Bloques": todos los bloques de construcción de Minecraft (piedra, madera, lana,
#     terracota, concreto, cristal, cobre, corales, nether, end...). Dentro del menú hay
#     filtros por tipo (config.yml -> category-filters).
#   - "Madera": TODO lo de madera (troncos, madera, tallos, tablones, escaleras, losas, vallas,
#     portones, puertas, trampillas, botones, placas, carteles, barcas, mobiliario). Filtros en config.yml.
#   - "Decoración": naturaleza (flores, hojas, plantas, hongos), luces, camas, estandartes,
#     alfombras, velas, carteles, cabezas, cerámica y tintes.
#   - "Drops de Mobs": solo lo que sueltan los mobs. "Spawners": se activa/desactiva en config.yml
#     (category-settings.spawners.enabled).
#   - Minerales, comida, equipamiento, redstone, mobs, spawners y objetos especiales
#     tienen su propia categoría.
#   - Prohibidos (no se venden): bedrock, command blocks, barrier, structure blocks,
#     jigsaw, light, end portal frame, reinforced deepslate, dragon egg, budding amethyst,
#     bloques infestados y similares.
#  Los Material son válidos para Minecraft 1.20.x (Spigot/Paper).
# =========================================================

